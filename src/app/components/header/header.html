<header class="header" dir="rtl">

  <!-- Logo on mobile / collapsed area -->
  <div class="mobile-brand">
    <span class="brand-icon">🌿</span>
    <span class="brand-name">NGO ERP</span>
  </div>


  <!-- Search -->
  <div class="header-search">

    <span class="search-icon">
      🔍
    </span>

    <input
      type="text"
      placeholder="ابحث عن مستفيد، رقم الهوية، رقم الملف ..."
    />

    <span class="search-shortcut">
      ⌘
    </span>

  </div>


  <!-- Header Actions -->
  <div class="header-actions">

    <!-- Notifications -->
    <button
      class="header-button"
      title="الإشعارات"
      (click)="openNotifications()">

      <span class="icon">🔔</span>

      @if (notificationCount > 0) {
        <span class="notification-badge">
          {{ notificationCount }}
        </span>
      }

    </button>


    <!-- Messages -->
    <button
      class="header-button"
      title="الرسائل"
      (click)="openMessages()">

      <span class="icon">💬</span>

    </button>


    <!-- Calendar -->
    <button
      class="header-button"
      title="التقويم"
      (click)="openCalendar()">

      <span class="icon">📅</span>

    </button>


    <!-- User -->
    <button
      class="user-profile"
      (click)="openProfile()">

      <div class="user-avatar">
        <img
          src="assets/images/user.jpg"
          alt="أحمد محمد">
      </div>

      <div class="user-info">

        <strong>أحمد محمد</strong>

        <span>مدير النظام</span>

      </div>

      <span class="arrow">
       ⌄
      </span>

    </button>


    <!-- Sidebar Toggle -->
    <button
      class="menu-button"
      title="القائمة"
      (click)="toggleMenu()">

      ☰

    </button>

  </div>

</header>
